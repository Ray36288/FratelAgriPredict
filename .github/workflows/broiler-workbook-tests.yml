name: Broiler workbook calculation tests
on:
  push:
    branches:
      - main
      - broiler-excel-parity-engine
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
jobs:
  workbook-calculations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check broiler-workbook-engine.js && node --check broiler-workbook-intelligence.js && node --check cloud-data.js
      - name: Verify Excel parity and calculation generalisation
        run: node --test tests/broiler-workbook-engine.test.js
