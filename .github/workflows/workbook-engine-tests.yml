name: Workbook calculation tests
on:
  push:
    branches: [main, broiler-workbook-engine]
  pull_request:
    branches: [main]
jobs:
  workbook-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/broiler-workbook-engine.test.js
